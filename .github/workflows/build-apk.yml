
name: Build Fire TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        run: |
          PROJECT_DIR=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRORE: progetto Gradle non trovato."
            echo "Contenuto repository:"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Progetto trovato: $PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
  working-directory: ${{ steps.project.outputs.dir }}
  run: |
    gradle --no-daemon --no-configuration-cache assembleDebug
      

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FireTV-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

